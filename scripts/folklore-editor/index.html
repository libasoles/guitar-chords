<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Lab</title>
  <link rel="stylesheet" href="/editor.css">
  <script src="/editor.js" type="module"></script>
</head>
<body>
  <header><h1>Lab</h1></header>
  <main>
    <section class="track-panel" aria-labelledby="track-heading">
      <div class="track-heading"><h2 id="track-heading">Track</h2><span id="track-count">0 compases</span></div>
      <p class="hint">Arrastrá compases de los ejercicios hasta acá. Podés mezclar sets y ordenar la secuencia.</p>
      <div id="track" role="list" aria-label="Track de compases"></div>
    </section>
    <div class="toolbar">
      <label for="collection">Set de ejercicios<select id="collection" disabled><option>Cargando…</option></select></label>
      <span id="status" role="status" aria-live="polite">Preparando el laboratorio…</span>
    </div>
    <section id="exercises" aria-label="Ejercicios" aria-busy="true"></section>
  </main>
</body>
</html>
