<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Lab</title>
  <link rel="stylesheet" href="/editor.css">
  <script src="/editor.js" type="module"></script>
</head>
<body>
  <header>
    <h1>Lab</h1>
    <select id="collection" aria-label="Set de ejercicios" disabled><option>Cargando…</option></select>
  </header>
  <section class="track-panel" aria-label="Track de compases">
    <button id="play" class="track-play" type="button" disabled></button>
    <div id="track" role="list" aria-label="Track de compases"></div>
  </section>
  <main>
    <p id="status" role="status" aria-live="polite"></p>
    <section id="exercises" aria-label="Ejercicios" aria-busy="true"></section>
  </main>
</body>
</html>
