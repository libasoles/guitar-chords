<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <!-- All site.css parts, in cascade order (the build concatenates them). -->
  <link rel="stylesheet" href="../src/site/css/01-base.css">
  <link rel="stylesheet" href="../src/site/css/02-guides.css">
  <link rel="stylesheet" href="../src/site/css/03-note-finder.css">
  <link rel="stylesheet" href="../src/site/css/04-home-promos.css">
  <link rel="stylesheet" href="../src/site/css/05-footer.css">
  <link rel="stylesheet" href="../src/site/css/06-picking-404.css">
  <link rel="stylesheet" href="../src/site/css/07-tab-editor.css">
  <link rel="stylesheet" href="../src/site/css/08-privacy.css">
  <link rel="stylesheet" href="../src/site/css/09-partitura-promo.css">
  <link rel="stylesheet" href="../src/site/css/10-partitura.css">
  <script>
    window.ChordDiagram = { render: function (target, chord) { target.textContent = JSON.stringify(chord.fingers); } };
    window.NOTE_FINDER_LABELS = ['C', 'C♯/D♭', 'D', 'D♯/E♭', 'E', 'F', 'F♯/G♭', 'G', 'G♯/A♭', 'A', 'A♯/B♭', 'B'];
    window.NOTE_FINDER_STRINGS = {};
  </script>
  <script src="../src/shared/chords-db.js"></script>
  <script src="../src/shared/chord-positions.js"></script>
  <script src="../src/shared/note-match.js"></script>
  <script src="../src/site/note-finder.js"></script>
</head>
<body>
  <div class="note-finder">
    <div class="note-finder-picker">
      <div class="note-finder-keys-head">
        <span class="note-finder-col-label note-finder-col-label-flats"><span class="note-finder-col-label-symbol">♭</span></span>
        <span class="note-finder-col-label note-finder-col-label-naturals">Notas</span>
        <span class="note-finder-col-label note-finder-col-label-sharps"><span class="note-finder-col-label-symbol">#</span></span>
      </div>
      <div class="note-finder-keys-viewport" id="noteFinderKeysViewport"><div class="note-finder-keys-track" id="noteFinderKeysTrack"></div></div>
      <button type="button" class="note-finder-clear" id="noteFinderClear">Limpiar</button>
    </div>
    <div class="note-finder-results">
      <p class="note-finder-results-label">Acordes</p>
      <div class="note-finder-results-scroll">
        <div class="note-finder-grid" id="noteFinderGrid"></div>
      </div>
    </div>
  </div>
</body>
</html>
