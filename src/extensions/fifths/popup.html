<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Circle of Fifths</title>
  <link rel="stylesheet" href="base.css">
  <link rel="stylesheet" href="fifths-wheel.css">
  <link rel="stylesheet" href="popup.css">
  <script src="popup.js"></script>
</head>
<body>
  <main id="fifths-tool" class="fifths-tool">
    <div id="fifths-wheel"></div>
    <section class="fifths-detail" aria-labelledby="fifths-key">
      <header class="popup-header">
        <span class="logo" aria-hidden="true"></span>
        <span class="wordmark" id="wordmark">Circle of Fifths</span>
      </header>
      <h2 id="fifths-key"></h2>
      <div class="fifths-signature" id="fifths-signature"></div>
      <div id="fifths-chords" class="fifths-chords"></div>
      <a class="site-link" id="site-link" target="_blank" rel="noopener">
        <span id="site-link-label"></span>
        <svg class="site-link-icon" viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 3h6v6"/><path d="M10 14 21 3"/><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/></svg>
      </a>
    </section>
  </main>
  <script src="fifths-wheel.js"></script>
</body>
</html>
