<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Chord Identifier</title>
  <link rel="stylesheet" href="popup.css">
  <script type="module" src="vendor/ascii-tabs.js"></script>
</head>
<body>
  <header class="site-header">
    <span class="logo" aria-hidden="true"></span>
    <span class="wordmark" id="wordmark">Chord Identifier</span>
  </header>

  <main class="layout">
    <div class="results-column">
    <div class="view-group" id="view-group" role="group">
      <button type="button" id="view-tabs" class="view-option" aria-pressed="true">
        <!-- Lucide: align-justify -->
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18"/><path d="M3 12h18"/><path d="M3 18h18"/></svg>
        <span id="view-tabs-label">Tablature</span>
      </button>
      <button type="button" id="view-diagrams" class="view-option" aria-pressed="false">
        <!-- Lucide: grid-3x3 -->
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M3 9h18"/><path d="M3 15h18"/><path d="M9 3v18"/><path d="M15 3v18"/></svg>
        <span id="view-diagrams-label">Diagrams</span>
      </button>
    </div>
      <div class="results-shell">
        <div id="results" class="results" role="region" aria-live="polite"></div>
      </div>
    </div>
    <aside class="search">
      <ascii-tabs id="query" class="query-tab" theme="light" labels="notes" spacing="3"><ascii-tabs-sheet></ascii-tabs-sheet></ascii-tabs>
      <button type="button" id="clear" class="clear"></button>
    </aside>
  </main>

  <footer class="panel-footer">
    <a id="site-link" href="https://acordesdeguitarra.com.ar/en/resources/tabs-for-arpeggios" target="_blank" rel="noopener noreferrer">
      <span id="site-label">All arpeggio tabs</span>
      <!-- Lucide: external-link -->
      <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M15 3h6v6"/><path d="M10 14 21 3"/><path d="M21 14v5a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5"/>
      </svg>
    </a>
  </footer>

  <!-- All local: MV3 CSP forbids inline scripts and CDN. -->
  <script src="vendor/svguitar.umd.js"></script>
  <script src="chord-diagram.js"></script>
  <script src="chord-card.js"></script>
  <script src="note-names.js"></script>
  <script src="arpeggio-data.js"></script>
  <script src="popup.js"></script>
</body>
</html>
