<!doctype html>
<html lang="%%htmlLang%%">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>%%PAGE_TITLE%%</title>
    <meta name="description" content="%%PAGE_META_DESCRIPTION%%" />
    <link rel="canonical" href="%%canonicalUrl%%" />
    <link rel="alternate" hreflang="es" href="%%hreflangEs%%" />
    <link rel="alternate" hreflang="en" href="%%hreflangEn%%" />
    <link rel="alternate" hreflang="x-default" href="%%hreflangEs%%" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="%%PAGE_TITLE%%" />
    <meta property="og:description" content="%%PAGE_META_DESCRIPTION%%" />
    <meta property="og:url" content="%%canonicalUrl%%" />
    <meta property="og:image" content="%%ogImage%%" />
    <meta property="og:site_name" content="Guitar Chords" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="%%PAGE_TITLE%%" />
    <meta name="twitter:description" content="%%PAGE_META_DESCRIPTION%%" />
    <meta name="twitter:image" content="%%ogImage%%" />
    <link rel="icon" type="image/svg+xml" href="%%ASSETS_PREFIX%%favicon.svg" />
    <link rel="manifest" href="%%MANIFEST_HREF%%" />
    <meta name="theme-color" content="#fdfaf5" />
    <link rel="apple-touch-icon" href="%%ASSETS_PREFIX%%icons/icon-192.png" />
    <link rel="stylesheet" href="%%ASSETS_PREFIX%%site.css" />
    <script
      async
      src="https://www.googletagmanager.com/gtag/js?id=G-0S8GH7ZFHT"
    ></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }
      gtag("js", new Date());
      gtag("config", "G-0S8GH7ZFHT");
    </script>
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="%%homeHref%%">
        <svg class="logo" viewBox="0 0 48 48" aria-hidden="true">
          <rect class="frame" x="8" y="8" width="32" height="32" rx="3" />
          <line class="string" x1="18" y1="8" x2="18" y2="40" />
          <line class="string" x1="24" y1="8" x2="24" y2="40" />
          <line class="string" x1="30" y1="8" x2="30" y2="40" />
          <line class="string" x1="8" y1="20" x2="40" y2="20" />
          <line class="string" x1="8" y1="30" x2="40" y2="30" />
          <circle class="dot" cx="18" cy="25" r="3.2" />
          <circle class="dot" cx="30" cy="15" r="3.2" />
        </svg>
        <span class="wordmark"
          >%%wordmark%%<small>%%wordmarkSmall%%</small></span
        >
      </a>
      <a class="lang-toggle" href="%%altLangHref%%">%%altLangLabel%%</a>
    </header>

    <main>
      <div class="tab-editor-heading">
        <h1>%%PAGE_H1%%</h1>
        <details class="tab-editor-menu">
          <summary role="button" aria-label="%%tabDisplayOptions%%" title="%%tabDisplayOptions%%">
            <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true">
              <path d="M4 6h16M4 12h16M4 18h16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
            </svg>
          </summary>
          <div class="tab-editor-options">
            <label>
              <input type="checkbox" id="tabNoteNames" aria-controls="tabEditor" />
              %%tabNoteNames%%
            </label>
            <label>
              <input type="checkbox" id="tabLetterLabels" aria-controls="tabEditor" />
              %%tabLetterLabels%%
            </label>
          </div>
        </details>
      </div>
      <p class="lead">%%PAGE_LEAD%%</p>

      <ascii-tabs
        class="tab-editor"
        id="tabEditor"
        lang="%%htmlLang%%"
        theme="light"
        spacing="2"
      >
        <ascii-tabs-storage key="tabEditor.tabs"></ascii-tabs-storage>
        <ascii-tabs-hint></ascii-tabs-hint>
        <ascii-tabs-spacing></ascii-tabs-spacing>
        <ascii-tabs-sheet>
          <ascii-tabs-copy></ascii-tabs-copy>
          <ascii-tabs-delete></ascii-tabs-delete>
        </ascii-tabs-sheet>
        <ascii-tabs-add></ascii-tabs-add>
      </ascii-tabs>
      <script>
        // Three empty tabs to start; tabs saved in localStorage take precedence.
        document.getElementById("tabEditor").value = [[], [], []];
      </script>

      %%TAB_TUTORIAL%%
      <script>
        // ?tutorial opens the tutorial (linked from the partitura page).
        if (new URLSearchParams(location.search).has("tutorial")) {
          var tutorial = document.querySelector("details.tab-tutorial");
          if (tutorial) tutorial.open = true;
        }
      </script>
    </main>

    <script type="module" src="%%ASSETS_PREFIX%%vendor/ascii-tabs.js"></script>
    <script type="module">
      await customElements.whenDefined("ascii-tabs");
      const editor = document.getElementById("tabEditor");
      const noteNames = document.getElementById("tabNoteNames");
      const letterLabels = document.getElementById("tabLetterLabels");
      function updateDisplay() {
        editor.notation = noteNames.checked
          ? (editor.lang === "es" ? "solfege" : "letters")
          : "frets";
        editor.labels = letterLabels.checked ? "notes" : "numbers";
      }
      noteNames.addEventListener("change", updateDisplay);
      letterLabels.addEventListener("change", updateDisplay);
      updateDisplay();
      const menu = document.querySelector(".tab-editor-menu");
      document.addEventListener("click", (event) => {
        if (!menu.contains(event.target)) menu.open = false;
      });
      document.addEventListener("keydown", (event) => {
        if (event.key === "Escape" && menu.open) {
          menu.open = false;
          menu.querySelector("summary").focus();
        }
      });
    </script>
    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", function () {
          navigator.serviceWorker.register("%%SW_PATH%%").catch(function () {});
        });
      }
    </script>
  </body>
</html>
