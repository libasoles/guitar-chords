<!doctype html>
<html lang="%%htmlLang%%">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>%%PAGE_TITLE%%</title>
    <meta name="description" content="%%PAGE_META_DESCRIPTION%%" />
    <link rel="canonical" href="%%canonicalUrl%%" />
    <link rel="alternate" hreflang="es" href="%%hreflangEs%%" />
    <link rel="alternate" hreflang="en" href="%%hreflangEn%%" />
    <link rel="alternate" hreflang="x-default" href="%%hreflangEs%%" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="%%PAGE_TITLE%%" />
    <meta property="og:description" content="%%PAGE_META_DESCRIPTION%%" />
    <meta property="og:url" content="%%canonicalUrl%%" />
    <meta property="og:image" content="%%ogImage%%" />
    <meta property="og:site_name" content="Guitar Chords" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="%%PAGE_TITLE%%" />
    <meta name="twitter:description" content="%%PAGE_META_DESCRIPTION%%" />
    <meta name="twitter:image" content="%%ogImage%%" />
    <link rel="icon" type="image/svg+xml" href="%%ASSETS_PREFIX%%favicon.svg" />
    <link rel="manifest" href="%%MANIFEST_HREF%%" />
    <meta name="theme-color" content="#fdfaf5" />
    <link rel="apple-touch-icon" href="%%ASSETS_PREFIX%%icons/icon-192.png" />
    <link rel="stylesheet" href="%%ASSETS_PREFIX%%site.css" />
    <script
      async
      src="https://www.googletagmanager.com/gtag/js?id=G-0S8GH7ZFHT"
    ></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }
      gtag("js", new Date());
      gtag("config", "G-0S8GH7ZFHT");
    </script>
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="%%homeHref%%">
        <svg class="logo" viewBox="0 0 48 48" aria-hidden="true">
          <rect class="frame" x="8" y="8" width="32" height="32" rx="3" />
          <line class="string" x1="18" y1="8" x2="18" y2="40" />
          <line class="string" x1="24" y1="8" x2="24" y2="40" />
          <line class="string" x1="30" y1="8" x2="30" y2="40" />
          <line class="string" x1="8" y1="20" x2="40" y2="20" />
          <line class="string" x1="8" y1="30" x2="40" y2="30" />
          <circle class="dot" cx="18" cy="25" r="3.2" />
          <circle class="dot" cx="30" cy="15" r="3.2" />
        </svg>
        <span class="wordmark"
          >%%wordmark%%<small>%%wordmarkSmall%%</small></span
        >
      </a>
      <a class="lang-toggle" href="%%altLangHref%%">%%altLangLabel%%</a>
    </header>

    <main>
      <h1>%%PAGE_H1%%</h1>
      <p class="lead">%%PAGE_LEAD%%</p>

      <div class="tab-editor" id="tabEditor">
        <p class="tab-editor-hint">%%tabEditorHint%%</p>
        <div id="tabSheets"></div>
        <button
          id="tabAdd"
          class="tab-icon-btn tab-add"
          type="button"
          title="%%tabEditorAddLabel%%"
          aria-label="%%tabEditorAddLabel%%"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="M5 12h14" />
            <path d="M12 5v14" />
          </svg>
        </button>
        <input
          id="tabKey"
          class="tab-key"
          inputmode="numeric"
          autocomplete="off"
          autocorrect="off"
          spellcheck="false"
          aria-label="%%tabEditorFretLabel%%"
        />
        <span id="tabProbe" class="tab-probe" aria-hidden="true"
          >0000000000</span
        >
      </div>
      <p class="tab-source">%%SIXTHS_SOURCE%%</p>
      <div class="tab-video">
        <iframe
          src="https://www.youtube-nocookie.com/embed/%%SIXTHS_VIDEO_ID%%"
          title="%%PAGE_H1%%"
          loading="lazy"
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
          referrerpolicy="strict-origin-when-cross-origin"
          allowfullscreen
        ></iframe>
      </div>
    </main>

    <script>
      window.TAB_EDITOR_OPTIONS = %%TAB_EDITOR_OPTIONS_JSON%%;
    </script>
    <script src="%%ASSETS_PREFIX%%tab-editor.js"></script>
    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", function () {
          navigator.serviceWorker.register("%%SW_PATH%%").catch(function () {});
        });
      }
    </script>
  </body>
</html>
