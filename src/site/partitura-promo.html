<section class="part-promo" aria-labelledby="part-promo-title">
  <a class="part-promo-link" href="%%PARTITURA_PAGE_HREF%%">
    <img
      class="part-promo-img"
      src="%%ASSETS_PREFIX%%partitura-banner.webp"
      width="480"
      height="436"
      loading="lazy"
      decoding="async"
      alt="%%partPromoAlt%%"
    />
    <div class="part-promo-copy">
      <p class="part-promo-kicker">%%partPromoKicker%%</p>
      <h2 id="part-promo-title">%%partPromoTitle%%</h2>
      <p class="part-promo-desc">%%partPromoDescription%%</p>
      <span class="part-promo-cta">%%partPromoCta%%</span>
    </div>
  </a>
</section>
