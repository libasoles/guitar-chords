<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <defs>
    <style>
      .bg2 { fill: #FBF8EE; }
      .st-thick { stroke: #1D2A3A; stroke-width: 4.5; stroke-linecap: round; stroke-linejoin: round; }
      .st-mid { stroke: #1D2A3A; stroke-width: 3; stroke-linecap: round; }
      
      /* Animaciones */
      .orbit-notes { transform-origin: 150px 145px; animation: orbit 6s linear infinite; }
      .bounce-guitar { transform-origin: 150px 145px; animation: bounce 1.8s ease-in-out infinite alternate; }

      @keyframes orbit {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes bounce {
        0% { transform: translateY(-6px) rotate(-1deg); }
        100% { transform: translateY(6px) rotate(2deg); }
      }
    </style>
  </defs>

  <rect class="bg2" width="300" height="300" rx="20"/>

  <!-- Orbitador de partituras y notas cubistas -->
  <g class="orbit-notes">
    <!-- Fragmento de partitura 1 -->
    <polygon points="60,85 100,70 110,110 70,125" fill="#F4C542" class="st-thick"/>
    <line x1="68" y1="90" x2="100" y2="78" class="st-mid"/>
    <line x1="71" y1="98" x2="103" y2="86" class="st-mid"/>
    <line x1="74" y1="106" x2="106" y2="94" class="st-mid"/>

    <!-- Fragmento de partitura 2 -->
    <polygon points="190,165 235,150 240,195 195,210" fill="#4C859B" class="st-thick"/>
    <line x1="198" y1="172" x2="231" y2="160" stroke="#FBF8EE" stroke-width="2.5"/>
    <line x1="200" y1="180" x2="233" y2="168" stroke="#FBF8EE" stroke-width="2.5"/>

    <!-- Notas geométricas -->
    <rect x="200" y="75" width="14" height="14" fill="#E75A65" class="st-thick" transform="rotate(15 200 75)"/>
    <circle cx="95" cy="190" r="8" fill="#EA6A47" class="st-thick"/>
  </g>

  <!-- Guitarra criolla en el centro (Animada) -->
  <g class="bounce-guitar">
    <!-- CUERPO DE LA GUITARRA CRiOLLA (Doble lóbulo superpuesto) -->
    <!-- Lóbulo Inferior (Grande - Azul) -->
    <ellipse cx="150" cy="195" rx="36" ry="28" fill="#4C859B" class="st-thick" />
    
    <!-- Lóbulo Superior (Pequeño - Amarillo) -->
    <ellipse cx="150" cy="154" rx="28" ry="22" fill="#F4C542" class="st-thick" />
    
    <!-- Unión/Cintura de la guitarra (para dar el efecto de criolla de dos círculos) -->
    <path d="M 120 172 Q 130 172 122 154" fill="none" class="st-thick" />
    <path d="M 180 172 Q 170 172 178 154" fill="none" class="st-thick" />
    
    <!-- Boca / Roseta de la guitarra -->
    <circle cx="150" cy="160" r="12" fill="#1D2A3A" class="st-thick"/>
    <circle cx="150" cy="160" r="6" fill="#FBF8EE" />

    <!-- Mástil -->
    <rect x="141" y="55" width="18" height="85" fill="#FBF8EE" class="st-thick"/>
    
    <!-- Trastes -->
    <line x1="141" y1="70" x2="159" y2="70" class="st-mid"/>
    <line x1="141" y1="88" x2="159" y2="88" class="st-mid"/>
    <line x1="141" y1="106" x2="159" y2="106" class="st-mid"/>
    <line x1="141" y1="124" x2="159" y2="124" class="st-mid"/>

    <!-- Cuerdas -->
    <line x1="145" y1="55" x2="145" y2="175" stroke="#1D2A3A" stroke-width="1.5" />
    <line x1="150" y1="55" x2="150" y2="175" stroke="#1D2A3A" stroke-width="1.5" />
    <line x1="155" y1="55" x2="155" y2="175" stroke="#1D2A3A" stroke-width="1.5" />

    <!-- Puente de la guitarra -->
    <rect x="138" y="194" width="24" height="6" fill="#1D2A3A" class="st-thick"/>

    <!-- Clavijero (Rojo/Coral) -->
    <path d="M 136 55 L 164 55 L 164 25 L 136 25 Z" fill="#E75A65" class="st-thick"/>
    
    <!-- 6 Clavijas (3 de cada lado) -->
    <!-- Clavijas Izquierdas -->
    <rect x="126" y="27" width="10" height="5" fill="#4C859B" class="st-thick"/>
    <rect x="126" y="37" width="10" height="5" fill="#4C859B" class="st-thick"/>
    <rect x="126" y="47" width="10" height="5" fill="#4C859B" class="st-thick"/>
    
    <!-- Clavijas Derechas -->
    <rect x="164" y="27" width="10" height="5" fill="#4C859B" class="st-thick"/>
    <rect x="164" y="37" width="10" height="5" fill="#4C859B" class="st-thick"/>
    <rect x="164" y="47" width="10" height="5" fill="#4C859B" class="st-thick"/>
  </g>
</svg>
