<!doctype html>
<html lang="%%htmlLang%%">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>%%PAGE_TITLE%%</title>
    <meta name="description" content="%%PAGE_META_DESCRIPTION%%" />
    <link rel="canonical" href="%%canonicalUrl%%" />
    <link rel="alternate" hreflang="es" href="%%hreflangEs%%" />
    <link rel="alternate" hreflang="en" href="%%hreflangEn%%" />
    <link rel="alternate" hreflang="x-default" href="%%hreflangEs%%" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="%%PAGE_TITLE%%" />
    <meta property="og:description" content="%%PAGE_META_DESCRIPTION%%" />
    <meta property="og:url" content="%%canonicalUrl%%" />
    <meta property="og:image" content="%%ogImage%%" />
    <meta property="og:site_name" content="Guitar Chords" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="%%PAGE_TITLE%%" />
    <meta name="twitter:description" content="%%PAGE_META_DESCRIPTION%%" />
    <meta name="twitter:image" content="%%ogImage%%" />
    <link rel="icon" type="image/svg+xml" href="%%ASSETS_PREFIX%%favicon.svg" />
    <link rel="manifest" href="%%MANIFEST_HREF%%" />
    <meta name="theme-color" content="#fdfaf5" />
    <link rel="apple-touch-icon" href="%%ASSETS_PREFIX%%icons/icon-192.png" />
    <link rel="stylesheet" href="%%ASSETS_PREFIX%%site.css" />
    <script
      async
      src="https://www.googletagmanager.com/gtag/js?id=G-0S8GH7ZFHT"
    ></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }
      gtag("js", new Date());
      gtag("config", "G-0S8GH7ZFHT");
    </script>
  </head>
  <body class="partitura-body">
    <header class="site-header">
      <a class="brand" href="%%homeHref%%">
        <svg class="logo" viewBox="0 0 48 48" aria-hidden="true">
          <rect class="frame" x="8" y="8" width="32" height="32" rx="3" />
          <line class="string" x1="18" y1="8" x2="18" y2="40" />
          <line class="string" x1="24" y1="8" x2="24" y2="40" />
          <line class="string" x1="30" y1="8" x2="30" y2="40" />
          <line class="string" x1="8" y1="20" x2="40" y2="20" />
          <line class="string" x1="8" y1="30" x2="40" y2="30" />
          <circle class="dot" cx="18" cy="25" r="3.2" />
          <circle class="dot" cx="30" cy="15" r="3.2" />
        </svg>
        <span class="wordmark"
          >%%wordmark%%<small>%%wordmarkSmall%%</small></span
        >
      </a>
      <a class="lang-toggle" href="%%altLangHref%%">%%altLangLabel%%</a>
    </header>

    <main class="partitura-page">
      <h1>%%PAGE_H1%%</h1>
      <p class="lead">%%PAGE_LEAD%%</p>

      <form id="partForm" class="part-form" novalidate>
        <label class="part-rights">
          <input type="checkbox" id="partRights" required />
          <span>%%partRightsLabel%%</span>
        </label>
        <label id="partDropzone" class="part-dropzone" aria-disabled="true">
          <input
            class="part-file-input"
            type="file"
            id="partFile"
            accept=".pdf,.mxl,.musicxml,.xml,application/pdf"
            aria-labelledby="partDropTitle"
            aria-describedby="partDropHint"
            disabled
          />
          <svg class="part-upload-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
            <path d="M12 16V4m-4 4 4-4 4 4M4 15v4a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-4" />
          </svg>
          <strong id="partDropTitle">%%partDropTitle%%</strong>
          <span class="part-drop-browse">%%partDropBrowse%%</span>
          <span id="partDropHint">%%partFileLabel%%</span>
        </label>
        <div id="partTurnstile" class="part-turnstile"></div>
        <figure class="part-example">
          <figcaption>
            <strong>%%partExampleTitle%%</strong>
            <span>%%partExampleCaption%%</span>
          </figcaption>
          <img
            src="%%ASSETS_PREFIX%%partitura-example.svg"
            width="620"
            height="400"
            alt="%%partExampleAlt%%"
          />
        </figure>
      </form>

      <p id="partError" class="part-error" role="alert" hidden></p>

      <section id="partProgress" class="part-progress" aria-live="polite" hidden>
        <img
          class="part-loading"
          src="%%ASSETS_PREFIX%%partitura-loading.svg"
          width="96"
          height="96"
          alt="%%partLoadingAlt%%"
        />
        <p id="partStatus" class="part-status"></p>
        <p id="partElapsed" class="part-elapsed"></p>
        <p class="part-resume">%%partResumeHint%%</p>
      </section>

      <section id="partResult" class="part-result" hidden></section>

      <details class="part-privacy">
        <summary>%%partPrivacySummary%%</summary>
        <p>%%partPrivacyBody%%</p>
        <p>%%partPrivacyIp%%</p>
        <p><a href="%%PRIVACY_HREF%%">%%partPrivacyLink%%</a></p>
      </details>
    </main>

    <script>
      window.PARTITURA_CONFIG = %%PARTITURA_CONFIG%%;
    </script>
    <script type="module" src="%%ASSETS_PREFIX%%vendor/ascii-tabs.js"></script>
    <script defer src="%%ASSETS_PREFIX%%partitura.js"></script>
    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", function () {
          navigator.serviceWorker.register("%%SW_PATH%%").catch(function () {});
        });
      }
    </script>
  </body>
</html>
