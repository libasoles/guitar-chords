<!doctype html>
<html lang="%%htmlLang%%">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>%%PAGE_TITLE%%</title>
    <meta name="description" content="%%PAGE_META_DESCRIPTION%%" />
    <link rel="canonical" href="%%canonicalUrl%%" />
    <link rel="alternate" hreflang="es" href="%%hreflangEs%%" />
    <link rel="alternate" hreflang="en" href="%%hreflangEn%%" />
    <link rel="alternate" hreflang="x-default" href="%%hreflangEs%%" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="%%ogLocale%%" />
    <meta property="og:title" content="%%PAGE_TITLE%%" />
    <meta property="og:description" content="%%PAGE_META_DESCRIPTION%%" />
    <meta property="og:url" content="%%canonicalUrl%%" />
    <meta property="og:image" content="%%ogImage%%" />
    <meta property="og:site_name" content="Guitar Chords" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="%%PAGE_TITLE%%" />
    <meta name="twitter:description" content="%%PAGE_META_DESCRIPTION%%" />
    <meta name="twitter:image" content="%%ogImage%%" />
    <link rel="icon" type="image/svg+xml" href="%%ASSETS_PREFIX%%favicon.svg" />
    <link rel="manifest" href="%%MANIFEST_HREF%%" />
    <meta name="theme-color" content="#ffffff" />
    <link rel="apple-touch-icon" href="%%ASSETS_PREFIX%%icons/icon-192.png" />
    <link rel="stylesheet" href="%%ASSETS_PREFIX%%site.css" />
    <link rel="stylesheet" href="%%ASSETS_PREFIX%%score-editor.css" />
    
  </head>
  <body class="score-body">
    <header class="site-header">
      <a class="brand" href="%%homeHref%%">
        <svg class="logo" viewBox="0 0 48 48" aria-hidden="true">
          <rect class="frame" x="8" y="8" width="32" height="32" rx="3" />
          <line class="string" x1="18" y1="8" x2="18" y2="40" />
          <line class="string" x1="24" y1="8" x2="24" y2="40" />
          <line class="string" x1="30" y1="8" x2="30" y2="40" />
          <line class="string" x1="8" y1="20" x2="40" y2="20" />
          <line class="string" x1="8" y1="30" x2="40" y2="30" />
          <circle class="dot" cx="18" cy="25" r="3.2" />
          <circle class="dot" cx="30" cy="15" r="3.2" />
        </svg>
        <span class="wordmark"
          >%%wordmark%%<small>%%wordmarkSmall%%</small></span
        >
      </a>
    </header>

    <main class="score-page">
      <div class="score-workspace">
        <div class="score-main">
          <div class="score-toolbar" role="toolbar" aria-label="%%scoreToolbar%%">
            <div id="scorePalette" class="score-palette"></div>
          </div>
          <p id="scoreStatus" class="score-status" role="status" aria-live="polite"></p>
          <section class="score-sheet" aria-label="%%scoreLabel%%">
            <p class="score-author"><input id="scoreAuthor" type="text" placeholder="%%scoreAuthorPlaceholder%%" aria-label="%%scoreAuthorLabel%%" /></p>
            <h1 class="score-title"><span class="score-sr-only">%%scoreSeoH1%%</span><input id="scoreTitle" type="text" aria-label="%%scoreTitleLabel%%" value="%%PAGE_H1%%" /></h1>
            <div id="scoreStage" class="score-stage" tabindex="0" aria-label="%%scoreLabel%%"></div>
          </section>
        </div>
        <aside class="score-side">
          <div id="scoreBarlines" class="score-barlines" role="toolbar" aria-label="%%scoreBarlines%%" aria-orientation="vertical"></div>
        </aside>
        <aside class="score-side-bottom">
          <div class="score-side-actions">
            <button id="scoreClear" class="score-download tooltip" type="button" data-icon="trash" aria-label="%%scoreClear%%" data-tooltip="%%scoreClear%%"></button>
            <div id="scoreDownloads" class="score-downloads">
              <button id="scoreDownloadToggle" class="score-download tooltip" type="button" data-icon="download" aria-label="%%partDownloadsHeading%%" data-tooltip="%%partDownloadsHeading%%" aria-expanded="false" aria-controls="scoreDownloadOptions"></button>
              <div id="scoreDownloadOptions" class="score-download-options" hidden>
                <button id="scoreDownloadPdf" class="score-download" type="button" data-icon="file-text">PDF</button>
                <button id="scoreDownloadXml" class="score-download" type="button" data-icon="file-code">MusicXML</button>
              </div>
            </div>
          </div>
        </aside>
      </div>
      <div class="score-rows">
        <button id="scoreAddRow" class="score-tool" type="button" aria-label="%%scoreAddRow%%" title="%%scoreAddRow%%"></button>
        <button id="scoreRemoveRow" class="score-tool" type="button" aria-label="%%scoreRemoveRow%%" title="%%scoreRemoveRow%%" hidden></button>
      </div>
      <section class="score-about" aria-label="%%scoreSeoH1%%">
        <p class="score-about-lead">%%scoreAboutLead%%</p>
        <h2>%%scoreFeaturesH2%%</h2>
        <ul>%%SCORE_FEATURES%%</ul>
        <h2>%%scoreHowH2%%</h2>
        <ol>%%SCORE_HOW%%</ol>
        <h2>%%scoreFaqH2%%</h2>
        %%SCORE_FAQ%%
      </section>
    </main>

    <script type="application/json" id="scoreStrings">%%SCORE_STRINGS%%</script>
    <script src="%%ASSETS_PREFIX%%score-confirm.js"></script>
    <script src="%%ASSETS_PREFIX%%score-model.js"></script>
    <script src="%%ASSETS_PREFIX%%toast.js"></script>
    <script src="%%ASSETS_PREFIX%%score-editor.js"></script>
  </body>
</html>
