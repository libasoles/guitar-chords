<!doctype html>
<html lang="%%htmlLang%%">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>%%PAGE_TITLE%%</title>
    <meta name="description" content="%%PAGE_META_DESCRIPTION%%" />
    <meta name="robots" content="noindex, nofollow" />
    <link rel="canonical" href="%%canonicalUrl%%" />
    <link rel="icon" type="image/svg+xml" href="%%ASSETS_PREFIX%%favicon.svg" />
    <link rel="manifest" href="%%MANIFEST_HREF%%" />
    <meta name="theme-color" content="#fdfaf5" />
    <link rel="apple-touch-icon" href="%%ASSETS_PREFIX%%icons/icon-192.png" />
    <link rel="stylesheet" href="%%ASSETS_PREFIX%%site.css" />
    <link rel="stylesheet" href="%%ASSETS_PREFIX%%score-editor.css" />
    
  </head>
  <body class="score-body">
    <header class="site-header">
      <a class="brand" href="%%homeHref%%">
        <svg class="logo" viewBox="0 0 48 48" aria-hidden="true">
          <rect class="frame" x="8" y="8" width="32" height="32" rx="3" />
          <line class="string" x1="18" y1="8" x2="18" y2="40" />
          <line class="string" x1="24" y1="8" x2="24" y2="40" />
          <line class="string" x1="30" y1="8" x2="30" y2="40" />
          <line class="string" x1="8" y1="20" x2="40" y2="20" />
          <line class="string" x1="8" y1="30" x2="40" y2="30" />
          <circle class="dot" cx="18" cy="25" r="3.2" />
          <circle class="dot" cx="30" cy="15" r="3.2" />
        </svg>
        <span class="wordmark"
          >%%wordmark%%<small>%%wordmarkSmall%%</small></span
        >
      </a>
    </header>

    <main class="score-page">
      <h1 class="score-title">%%PAGE_H1%%</h1>
      <div class="score-toolbar" role="toolbar" aria-label="%%scoreToolbar%%">
        <div id="scorePalette" class="score-palette"></div>
        <button id="scoreTrash" class="score-tool" type="button" aria-label="%%scoreDelete%%" title="%%scoreDelete%%"></button>
        <span class="score-toolbar-gap"></span>
        <div id="scoreDownloads" class="score-downloads">
          <button id="scoreDownloadToggle" class="score-download" type="button" data-icon="download" aria-label="%%partDownloadsHeading%%" title="%%partDownloadsHeading%%" aria-expanded="false" aria-controls="scoreDownloadOptions"></button>
          <div id="scoreDownloadOptions" class="score-download-options" hidden>
            <button id="scoreDownloadPdf" class="score-download" type="button">PDF</button>
            <button id="scoreDownloadXml" class="score-download" type="button">MusicXML</button>
          </div>
        </div>
      </div>
      <p id="scoreStatus" class="score-status" role="status" aria-live="polite"></p>
      <div id="scoreStage" class="score-stage" tabindex="0" aria-label="%%scoreLabel%%"></div>
      <div class="score-rows">
        <button id="scoreAddRow" class="score-tool" type="button" aria-label="%%scoreAddRow%%" title="%%scoreAddRow%%"></button>
        <button id="scoreRemoveRow" class="score-tool" type="button" aria-label="%%scoreRemoveRow%%" title="%%scoreRemoveRow%%" hidden></button>
      </div>
    </main>

    <script type="application/json" id="scoreStrings">%%SCORE_STRINGS%%</script>
    <script src="%%ASSETS_PREFIX%%score-model.js"></script>
    <script src="%%ASSETS_PREFIX%%score-editor.js"></script>
  </body>
</html>
