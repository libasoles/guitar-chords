<?xml version="1.0" encoding="UTF-8"?>
<!-- Original cubist guitarist logo. Transparent background. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Guitarrista cubista</title>
  <desc id="desc">Una persona abstracta toca una guitarra acústica.</desc>
  <g stroke="#293044" stroke-width="9" stroke-linejoin="round" stroke-linecap="round">
    <!-- The face: a split, mask-like cubist profile. -->
    <path fill="#F6C85F" d="M191 65c32-20 78-12 101 20l-20 52-51 26-49-33z"/>
    <path fill="#E96D50" d="M191 65l30 98-38 42-31-49z"/>
    <path fill="#FAF0D3" d="M221 163l51-26 12 46-42 25z"/>
    <circle cx="240" cy="109" r="7" fill="#293044" stroke="none"/>
    <path fill="none" d="M244 144l22 8"/>

    <!-- Torso built from deliberately mismatched planes. -->
    <path fill="#4A7C93" d="M149 183l73-28 68 54-24 96-93 5-48-69z"/>
    <path fill="#D85B70" d="M222 155l78 24 42 82-76 44-26-71z"/>
    <path fill="#F6C85F" d="M149 183l-24 58 48 69 38-56z"/>

    <!-- Back arm and hand around the neck. -->
    <path fill="#E96D50" d="M287 189l43 16 66 57-25 31-67-43-37-22z"/>
    <path fill="#F6C85F" d="M377 267l31-24 29 27-15 25-27 6z"/>

    <!-- Guitar body, with two complementary halves. -->
    <path fill="#F6C85F" d="M167 287c-28-11-58 12-58 43 0 31 28 54 57 44 7 43 56 59 85 31 30-30 11-78-31-77-9-19-28-33-53-41z"/>
    <path fill="#4A7C93" d="M220 328c42-1 61 47 31 77-29 28-78 12-85-31 26-9 42-26 54-46z"/>
    <circle cx="190" cy="342" r="18" fill="#293044"/>
    <path fill="none" stroke="#FAF0D3" stroke-width="5" d="M158 317c22 25 50 46 83 62"/>

    <!-- Neck, headstock and tuning pegs. -->
    <path fill="#FAF0D3" d="M212 307l184-124 24 34-184 124z"/>
    <path fill="#D85B70" d="M393 184l47-31 28 39-48 31z"/>
    <path fill="#F6C85F" d="M436 156l21-14 29 40-19 14z"/>
    <path fill="none" stroke="#293044" stroke-width="5" d="M231 309l184-124M239 321l184-124"/>
    <path fill="#4A7C93" d="M463 151l22-9 10 17-21 10zM473 180l24 7-6 19-23-7zM454 202l17 18-13 14-18-17z"/>

    <!-- Forearm crossing the soundboard. -->
    <path fill="#E96D50" d="M111 235l34-21 84 72-25 33-68-52z"/>
    <path fill="#F6C85F" d="M111 235l25 32-16 21-25-27z"/>
  </g>
</svg>
