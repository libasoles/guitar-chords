name: CI

run-name: "CI · ${{ github.event_name == 'pull_request' && format('PR #{0}: {1}', github.event.number, github.event.pull_request.title) || format('push to {0}: {1}', github.ref_name, github.event.head_commit.message) }}"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Picks the e2e suites a PR needs from its changed files (see
  # scripts/ci-e2e-targets.js). Pushes to main always run every suite.
  changes:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.targets.outputs.matrix }}
      any: ${{ steps.targets.outputs.any }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'

      - name: Select e2e suites
        id: targets
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            git diff --name-only "origin/$BASE_REF...HEAD" | node scripts/ci-e2e-targets.js > matrix.json
          else
            node scripts/ci-e2e-targets.js --all < /dev/null > matrix.json
          fi
          cat matrix.json
          echo "matrix=$(cat matrix.json)" >> "$GITHUB_OUTPUT"
          echo "any=$(node -p "require('./matrix.json').include.length > 0")" >> "$GITHUB_OUTPUT"

  test-and-build:
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-checks
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'

      - name: Install dependencies
        run: npm ci

      - name: Vendor (svguitar)
        run: npm run vendor

      - name: Build site
        run: npm run build:site
        env:
          PARTITURA_API_URL: ${{ vars.PARTITURA_API_URL }}
          TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}

      - name: Build extensions
        run: npm run build:ext

      - name: Unit tests
        run: npm run test:unit

      - name: Upload Guitar Chords artifact
        uses: actions/upload-artifact@v7
        with:
          name: guitar-chords-extension
          path: dist/extensions/chords.zip

      - name: Upload Guitar Tabs artifact
        uses: actions/upload-artifact@v7
        with:
          name: guitar-tabs-extension
          path: dist/extensions/tabs.zip

  e2e:
    needs: changes
    if: needs.changes.outputs.any == 'true'
    name: e2e (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.matrix) }}
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-e2e-${{ matrix.name }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Vendor (svguitar)
        run: npm run vendor

      # Same configuration as the deploy build, so the suites test what ships.
      - name: Build site
        if: matrix.build == 'site'
        run: npm run build:site
        env:
          PARTITURA_API_URL: ${{ vars.PARTITURA_API_URL }}
          TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}

      - name: Build extensions
        if: matrix.build == 'ext'
        run: npm run build:ext

      - name: E2E tests
        run: node test/${{ matrix.name }}.e2e.js

  # One stable check for branch protection: skipped e2e suites count as
  # passed; failed or cancelled jobs do not.
  ci-ok:
    needs: [test-and-build, e2e]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check results
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for r in $RESULTS; do
            case "$r" in success|skipped) ;; *) echo "A required job ended as $r"; exit 1 ;; esac
          done

  deploy:
    needs: [test-and-build, e2e]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    concurrency:
      group: ${{ github.workflow }}-deploy
      cancel-in-progress: false

    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'

      - name: Install dependencies
        run: npm ci

      - name: Vendor (svguitar)
        run: npm run vendor

      - name: Build site
        run: npm run build:site
        env:
          PARTITURA_API_URL: ${{ vars.PARTITURA_API_URL }}
          TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist/site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
