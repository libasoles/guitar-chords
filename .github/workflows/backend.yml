name: Backend

# Independent from the site CI (ci.yml). Only runs when backend or infra change.
on:
  pull_request:
    paths:
      - "backend/**"
      - "infra/**"
      - ".github/workflows/backend.yml"
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "infra/**"
      - ".github/workflows/backend.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04-arm
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-checks
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: API handler tests
        run: |
          pip install pytest
          python -m pytest backend/api -q
      - name: OCR task tests
        run: |
          sudo apt-get install -y --no-install-recommends poppler-utils
          pip install pytest numpy pillow
          python -m pytest backend/ocr -q
      - name: Infra template tests
        run: |
          pip install -r infra/requirements.txt
          python -m pytest infra/tests -q
      - name: Engine tests (inside the engine image)
        run: |
          docker build -t engine-test backend/engine
          docker run --rm --entrypoint python engine-test -m pytest -q /var/task

  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04-arm
    concurrency:
      group: ${{ github.workflow }}-deploy
      cancel-in-progress: false
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1
      - name: Install CDK
        run: |
          pip install -r infra/requirements.txt
          npm install -g aws-cdk
      - name: Deploy
        working-directory: infra
        run: cdk deploy GuitarChordsBackend --require-approval never
