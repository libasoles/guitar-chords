name: Backend

# Independent from the site CI (ci.yml). Only runs when backend or infra change.
on:
  pull_request:
    paths:
      - "backend/**"
      - "infra/**"
      - ".github/workflows/backend.yml"
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "infra/**"
      - ".github/workflows/backend.yml"

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: API handler tests
        run: |
          pip install pytest
          python -m pytest backend/api -q
      - name: Infra template tests
        run: |
          pip install -r infra/requirements.txt
          python -m pytest infra/tests -q
      - name: Engine tests (inside the engine image)
        run: |
          docker build -t engine-test backend/engine
          docker run --rm --entrypoint python engine-test -m pytest -q /var/task
